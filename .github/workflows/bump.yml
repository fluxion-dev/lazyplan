name: bump

# One-click semver progression: bump pyproject + README in a release PR.
# main is protected, so the bump lands through the PR and `tag-release`
# creates the tag after merge. Run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      part:
        description: "Semver part to bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump and commit without a tag
        run: ./tools/bump.sh "${{ inputs.part }}" --no-tag
      - name: Open the release pull request
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          BRANCH="release/v${NEXT}"
          git switch -c "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release v${NEXT}" \
            --body "Version bump to v${NEXT} from the bump workflow.

          Auto-merge is enabled. The \`gates\` check must pass; \`tag-release\`
          creates the tag after this PR lands."
          # A GITHUB_TOKEN push does not start pull_request workflows, so the
          # release PR would wait forever with no checks. Dispatch the gates
          # against the release branch before enabling auto-merge.
          gh workflow run ci.yml --ref "$BRANCH"
          # A GITHUB_TOKEN-created PR can still produce an action_required
          # pull_request run that never reports `gates`. Wait for the
          # dispatched run and publish its result as the required status on the
          # same commit, so the release never stalls on an approval click.
          RUN_ID=""
          for _ in $(seq 1 12); do
            RUN_ID="$(gh run list --workflow=ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "error: no gate run was dispatched for $BRANCH" >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status
          SHA="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=gates \
            -f description="dispatched gates passed"
          gh pr merge "$BRANCH" --auto --merge

  # Auto-merge runs with GITHUB_TOKEN, and GitHub does not start push-event
  # workflows for those pushes. Without this job the tag and the site deploy
  # would wait for the next human push.
  publish:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      # gh reads the repository from the checkout; without this, `gh pr view`
      # fails with "not a git repository" before it ever waits.
      - uses: actions/checkout@v4
      - name: Wait for the release pull request to merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.bump.outputs.version }}
        run: |
          # macOS runners can queue; allow 40 minutes for gates and merge.
          for _ in $(seq 1 120); do
            STATE="$(gh pr view "release/v${NEXT}" --json state --jq .state 2>/dev/null || true)"
            if [[ "$STATE" == "MERGED" ]]; then
              echo "release/v${NEXT} merged"
              exit 0
            fi
            if [[ "$STATE" == "CLOSED" ]]; then
              echo "error: release/v${NEXT} closed without merging" >&2
              exit 1
            fi
            sleep 20
          done
          echo "error: timed out waiting for release/v${NEXT} to merge" >&2
          exit 1
      - name: Create the tag and dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run tag-release.yml --ref main
      - name: Deploy the site for the new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
