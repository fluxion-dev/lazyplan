name: ci-windows

# Windows gates take 27-40 minutes, so they run nightly instead of on every
# pull request. Dispatch this workflow when a Windows change needs an
# on-demand gate.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows
  cancel-in-progress: false

jobs:
  gates-windows:
    name: gates (windows-latest, nightly)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (editable + dev extras)
        run: |
          python -m venv .venv
          if [[ -d .venv/Scripts ]]; then VENV_BIN=.venv/Scripts; else VENV_BIN=.venv/bin; fi
          "$VENV_BIN"/python -m pip install -e ".[dev]"
      - name: Gates (ruff + mypy + unittest x2)
        run: ./tools/check.sh
      - name: Upload snapshot failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-report-windows-latest
          path: |
            snapshot_report.html
            tests/snapshots/__snapshots__/**/*.svg
          if-no-files-found: ignore

  update-tests:
    name: windows update tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run update suites
        run: >-
          python -m unittest
          tests.cli.test_update_helper
          tests.cli.test_upgrade
          tests.core.test_staged_update
          tests.core.test_update_log
          tests.tui.test_update_screen
          tests.tui.test_update_notice

  update-smoke:
    name: windows update smoke
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipx
        run: python -m pip install --upgrade pipx
      - name: Run update smoke
        run: python tools/windows-update-smoke.py --artifacts windows-update-smoke-logs
      - name: Upload update logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-smoke-logs
          path: windows-update-smoke-logs
          if-no-files-found: ignore
