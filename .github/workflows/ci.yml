name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  platform:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (editable + dev extras)
        run: |
          python -m venv .venv
          if [[ -d .venv/Scripts ]]; then VENV_BIN=.venv/Scripts; else VENV_BIN=.venv/bin; fi
          "$VENV_BIN"/python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm ci
        working-directory: site
      - name: Gates (ruff + mypy + unittest + stdlib smoke)
        run: ./tools/check.sh

  tool-install:
    name: uv and pipx install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install pipx
        run: |
          python -m pip install --user pipx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install the wheel with uv and pipx
        run: ./tools/check-tool-install.sh --wheel dist/*.whl

  # The ruleset requires one check named `gates`; it passes only when Ubuntu
  # and macOS pass. Windows runs in ci-windows.yml on a nightly schedule.
  gates:
    needs: [platform, tool-install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.platform.result }}" = success
          test "${{ needs.tool-install.result }}" = success
