name: release

# Cut a GitHub Release from a version tag. Tags are created by
# .github/workflows/tag-release.yml after the release PR merges, or locally
# with ./tools/bump.sh --push, which guarantees the tag matches
# pyproject.toml. The workflow can also be dispatched against a tag ref.
# Artifacts per release: sdist + wheel (PyPI/pipx), .deb + .rpm per arch
# (system install), and install.sh (curl|sh front-end for all methods).
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag must match pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYVER="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [[ "$TAG" != "$PYVER" ]]; then
            echo "error: tag v$TAG != pyproject version $PYVER" >&2
            exit 1
          fi
          echo "releasing v$TAG"
      - name: Build sdist + wheel
        run: |
          python3 -m pip install build
          python3 -m build
      - name: Install nfpm (deb/rpm packager)
        run: |
          NFPM_VERSION="v2.47.0"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz" -o /tmp/nfpm.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          chmod +x /tmp/nfpm
          /tmp/nfpm --version
          echo "NFPM_BIN=/tmp/nfpm" >> "$GITHUB_ENV"
      - name: Build deb + rpm (amd64, arm64)
        run: |
          ./tools/package.sh --version "${GITHUB_REF_NAME#v}" --arch amd64 --format all --output dist/
          ./tools/package.sh --version "${GITHUB_REF_NAME#v}" --arch arm64 --format all --output dist/
          ls -la dist/
      - name: Smoke test (deb install + system wrapper)
        run: |
          sudo apt install -y ./dist/lazyplan_*_amd64.deb
          lpui --help
          lazyplan --help
          lpui list --help
          test -f /usr/share/man/man1/lpui.1
      - name: GitHub Release (auto-generated notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/* install.sh

  # PyPI publishing via Trusted Publishing (OIDC — no API tokens stored).
  # One-time setup (account owner, on pypi.org):
  #   project settings → Publishing → "Add a new pending publisher":
  #   owner fluxion-dev, repo lazyplan, workflow release.yml.
  publish-pypi:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python3 -m pip install build
          python3 -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
