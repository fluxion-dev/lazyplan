name: tag-release

# main is protected, so the bump workflow lands through a PR without a tag.
# Once a version change is on main, create the tag here and dispatch the
# release workflow. GITHUB_TOKEN tag pushes do not trigger other workflows,
# so release.yml is dispatched explicitly against the new tag.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the version tag if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "lazyplan v$VERSION"
          git push origin "v$VERSION"
          gh workflow run release.yml --ref "v$VERSION"
