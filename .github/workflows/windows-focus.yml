name: windows-focus

# A short Windows run for one failing area. Dispatch it while fixing a Windows
# failure, then run the full nightly gate once the focused selection is green.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to check out
        required: false
        default: main
        type: string
      tests:
        description: Unittest targets separated by spaces
        required: false
        default: tests.cli.test_evidence tests.store.test_store
        type: string
      repeat:
        description: Run the selected tests this many times
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: windows-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: focused windows tests
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pip-cache
          key: windows-focus-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install (editable + dev extras)
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
        run: |
          python -m venv .venv
          if [[ -d .venv/Scripts ]]; then VENV_BIN=.venv/Scripts; else VENV_BIN=.venv/bin; fi
          "$VENV_BIN"/python -m pip install -e ".[dev]"
      - name: Focused tests
        env:
          TESTS: ${{ inputs.tests }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          if [[ -d .venv/Scripts ]]; then VENV_BIN=.venv/Scripts; else VENV_BIN=.venv/bin; fi
          repeats="$REPEAT"
          case "$repeats" in ''|*[!0-9]*) repeats=1 ;; esac
          for ((run = 1; run <= repeats; run++)); do
            echo "::group::focused run $run/$repeats"
            PYTHONPATH=src "$VENV_BIN"/python -m unittest $TESTS -v
            echo "::endgroup::"
          done
