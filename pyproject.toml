[project]
name = "lazyplan-tui"
version = "0.30.1"
description = "Plan work with your coding agent, in the terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Brad Lindsay"}]
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8,<9", "textual-plotext>=1.0.1,<2"]
keywords = [
    "plan tracker",
    "coding agent",
    "ai agent",
    "developer tools",
    "terminal",
    "planning",
    "git",
    "pull requests",
    "provenance",
    "tui",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Version Control :: Git",
]
[project.urls]
Homepage = "https://github.com/fluxion-dev/lazyplan"
Documentation = "https://fluxion-dev.github.io/lazyplan/"
Usage = "https://github.com/fluxion-dev/lazyplan/blob/main/docs/usage.md"
Repository = "https://github.com/fluxion-dev/lazyplan"
Issues = "https://github.com/fluxion-dev/lazyplan/issues"
Changelog = "https://github.com/fluxion-dev/lazyplan/blob/main/CHANGELOG.md"
[project.scripts]
lazyplan = "lazyplan.cli:main"
lpui = "lazyplan.cli:main"
[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13", "vulture>=2.14", "xenon>=0.9", "pytest>=8", "pytest-textual-snapshot>=1.0"]
test = ["pytest>=8", "pytest-textual-snapshot>=1.0"]
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lazyplan = ["data/*.md", "tui/css/*.tcss"]

[tool.setuptools.data-files]
"share/man/man1" = ["docs/lpui.1", "docs/lazyplan.1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lazyplan"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
python_files = ["test_*.py", "snap_*.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
disallow_untyped_defs = true
