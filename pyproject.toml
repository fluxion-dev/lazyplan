[project]
name = "lazyplan"
version = "0.7.0"
description = "Terminal stream-of-consciousness console for issue tracking + roadmap planning alongside AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["textual>=3"]
[project.scripts]
lp = "lazyplan.cli:main"
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["ruff>=0.8", "mypy>=1.13"]
test = ["pytest>=8"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lazyplan"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
disallow_untyped_defs = true
