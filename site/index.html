<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is lazyplan?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A local plan your coding agents can read and write. Plans, milestones, tasks, and acceptance criteria live in one SQLite journal, and the read-only trail from each criterion to its commits and pull requests stays attached."
      }
    },
    {
      "@type": "Question",
      "name": "What happens on first run?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "lpui detects your agents, offers the setup wizard, and creates the plan store. The wizard asks where plans live, which agents receive the skill, how hooks behave, and which models each role uses. It lists every file it will write before anything is applied. Reopen it with lpui setup or by pressing S in the screen."
      }
    },
    {
      "@type": "Question",
      "name": "How does draft review work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An agent can add a plan as a draft instead of writing straight into the queue. You select a block or a quote and leave a comment, question, or change request. Saving it wakes the agent, which revises against the notes and answers each one; promotion creates the plan tree only when no annotation is open."
      }
    },
    {
      "@type": "Question",
      "name": "Where did the toasts go?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ordinary notices now land in a session log with their time and source. Press L from any screen to read it, scroll it, clear it, or copy a line. Only the startup notice and the once-per-version update notice still interrupt; warnings and errors badge the taskbar until you open the log."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need more than one agent?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. One agent can plan and execute. When you add workers, milestones become lanes and lpui dispatch --plan P prints the waves, the worktree commands, and the next command for each ready task."
      }
    },
    {
      "@type": "Question",
      "name": "How do parallel lanes avoid collisions?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A lane holds one doing task at a time, claims carry a lease with an expiry, and touch-points name the files a task expects. Parallel plans also require a lane cap and an integrator lane in a later wave."
      }
    },
    {
      "@type": "Question",
      "name": "Does it work with my coding agent?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Setup detects OpenCode, Claude Code, Codex, Cursor, Gemini CLI, and Copilot, and any agent that can run a command can use the CLI or the MCP server."
      }
    },
    {
      "@type": "Question",
      "name": "Where is my data stored?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "In a local SQLite database: your home directory by default, or inside the repo when setup chooses repo placement. There is no account and no cloud dependency, and you can export or import everything at any time."
      }
    },
    {
      "@type": "Question",
      "name": "How do updates work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The taskbar shows the running version. When the update cache knows a newer release it adds an arrow; click the badge or press U to download and verify a wheel that applies on the next launch. lpui upgrade does the same from the shell."
      }
    },
    {
      "@type": "Question",
      "name": "Does it run on Windows, macOS, and Linux?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Linux, macOS, and Windows; the plan stays local on all three."
      }
    }
  ]
}
